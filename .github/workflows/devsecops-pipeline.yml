name: SombraViva | DevSecOps

on:
  push:
  pull_request:
  workflow_dispatch:

# Sem permissões de escrita e sem acesso a segredos da aplicação.
permissions:
  contents: read

concurrency:
  group: sombraviva-devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Testes automatizados
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências de desenvolvimento
        run: python -m pip install -r requirements-dev.txt
      - name: Conferir CSS compilado
        run: python scripts/build_css.py --check
      - name: Executar pytest (isolado, sem MySQL externo)
        run: python -m pytest -q
      - name: Conferir sintaxe dos módulos
        run: python -m compileall -q app scripts

  secrets:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Procurar segredos no código e histórico
        # v3: Node 24. v2 não funciona nos runners atuais.
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

  sast:
    name: SAST - Bandit
    needs: [tests, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar Bandit
        run: python -m pip install 'bandit>=1.8,<2'
      - name: Analisar código de produção (severidade e confiança >= média)
        run: python -m bandit -r app scripts -ll -ii

  sca:
    name: SCA - pip-audit
    needs: [tests, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Instalar dependências e auditor
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install 'pip-audit>=2.7,<3'
      - name: Auditar dependências efetivamente instaladas
        run: python -m pip_audit --progress-spinner off

  trivy:
    name: Container Security - Trivy
    needs: [tests, secrets]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Construir contêiner sem publicar imagem
        shell: bash
        run: |
          # Atualiza o zlib1g antes da varredura, enquanto a imagem base não traz a correção.
          {
            sed 's/\r$//' Dockerfile
            printf '\n%s\n' 'RUN apt-get update && apt-get install -y --no-install-recommends --only-upgrade zlib1g && rm -rf /var/lib/apt/lists/*'
          } | docker build --pull -t sombraviva:ci -f - .
      - name: Analisar vulnerabilidades HIGH e CRITICAL corrigíveis
        # SHA imutável da action v0.36.0; não usar versões antigas de Trivy comprometidas em março/2026.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: image
          image-ref: sombraviva:ci
          format: table
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          exit-code: '1'

  result:
    name: Resultado DevSecOps
    needs: [tests, secrets, sast, sca, trivy]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Resumo verificável de todas as etapas
        env:
          TESTS: ${{ needs.tests.result }}
          SECRETS: ${{ needs.secrets.result }}
          SAST: ${{ needs.sast.result }}
          SCA: ${{ needs.sca.result }}
          TRIVY: ${{ needs.trivy.result }}
        run: |
          echo '## SombraViva · Resultado DevSecOps' >> "$GITHUB_STEP_SUMMARY"
          echo '| Etapa | Estado |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for job in TESTS SECRETS SAST SCA TRIVY; do
            value="${!job}"
            echo "| $job | $value |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [[ "$TESTS" != 'success' || "$SECRETS" != 'success' || "$SAST" != 'success' || "$SCA" != 'success' || "$TRIVY" != 'success' ]]; then
            echo 'Falha, cancelamento ou etapa não executada. Consulte o job correspondente.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo 'Todas as etapas concluídas com sucesso.' >> "$GITHUB_STEP_SUMMARY"
