name: SOA + Cybersecurity - testes
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Verificar CSS gerado
        run: python scripts/build_css.py --check
      - name: Testes isolados (SQLite em memória)
        run: python -m pytest -q
      - name: Verificar sintaxe Python
        run: python -m compileall -q app scripts
