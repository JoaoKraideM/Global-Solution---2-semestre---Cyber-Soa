services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${DB_NAME:-sombraviva}
      MYSQL_USER: ${DB_USER:-sombraviva}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no .env}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP -h 127.0.0.1 -uroot
          -p"$${MYSQL_ROOT_PASSWORD}" -e "SELECT 1" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  api:
    build: .
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-sombraviva}
      DB_USER: ${DB_USER:-sombraviva}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no .env}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  mysql_data:
